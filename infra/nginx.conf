server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  # Keep cross-origin isolation scoped to the WASM preview, not EmulatorJS.
  location = /recomp { return 302 /recomp/; }
  location ^~ /recomp/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
  location = /disc/nascar-rumble.cue {
    alias "/private-disc/NASCAR Rumble.cue";
    default_type text/plain;
    add_header Cache-Control "private, max-age=0, must-revalidate";
  }
  location / { try_files $uri $uri/ =404; }
  location = /disc/nascar-rumble.bin {
    alias "/private-disc/NASCAR Rumble.bin";
    default_type application/octet-stream;
    add_header Cache-Control "private, max-age=0, must-revalidate";
    add_header Accept-Ranges bytes;
  }
  location ^~ /disc/ { return 404; }
  location ~ /\. { deny all; }
}
